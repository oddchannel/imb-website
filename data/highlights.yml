- title: Tracking the number of items in working memory
  image: /images/site/highlight-thyer-2022.png
  text: >-
    Work from the [Awh and Vogel lab](https://awhvogellab.com/) found evidence for a distinct
    class of load-sensitive neural activity that indexes items without representing their
    contents per se. By analyzing electroencephalogram activity while adult human subjects
    stored varying numbers of items in visual working memory,
    [Thyer et al. 2022](https://awhvogellab.com/files/pdfs/Thyer_et_al_2022.pdf) precisely
    tracked the number of individuated items stored in working memory and robustly predicted
    individual differences in working memory capacity.

- title: COVID-19 and the olfactory system
  image: /images/site/highlight-kay-2022.jpg
  text: >-
    Professor [Leslie Kay](https://kaylab.uchicago.edu/) reviews COVID-19 infection via the
    olfactory system and the potential consequences of the body’s inflammatory response. She
    [discusses](https://journals.physiology.org/doi/full/10.1152/jn.00255.2022) the potential
    long-term implications of neurodegeneration observed in cortical areas that have
    connections with the olfactory system.

- title: A more reliable measure of working memory capacity
  image: /images/site/highlight-zhao-2022.png
  text: >-
    The [Awh and Vogel Lab](https://awhvogellab.com/) develops a change localization task
    variant that provides a highly reliable and sensitive approach for measuring visual
    working memory capacity.
    [Zhao et al., 2022](https://link.springer.com/article/10.3758/s13414-022-02586-0) shows
    the new task variant is far more reliable than the traditional change detection task,
    requiring only half the number of trials to achieve robust reliability.

- title: Brain connectivity during song learning
  image: ""
  text: >-
    Research from the [London Lab](https://voices.uchicago.edu/london/) investigates changes
    in brain connectivity during the critical development period for song learning in the
    zebra finch. By using functional imaging,
    [Layden et al. 2020](https://www.sciencedirect.com/science/article/pii/S1053811920307047)
    identified relationships between functional connectivity changes in specific brain
    regions involved in auditory processing and behavioral changes during this period.
