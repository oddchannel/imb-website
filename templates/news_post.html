{% extends "base.html" %}
{% block hero %}
  <section class="page-title">
    <div class="wrap">
      <p class="eyebrow"><a href="/news/">News</a>{% if page.category %} · {{ page.category }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
      <p class="subtitle">{{ page.date|shortdate }}</p>
    </div>
  </section>
{% endblock %}
{% block content %}
  <article class="prose">
    {% if page.image %}<img class="wide-image" src="{{ page.image }}" alt="">{% endif %}
    {{ page.content }}
    <p><a class="more" href="/news/">← All news</a></p>
  </article>
{% endblock %}
