{% extends "base.html" %}
{% from "_macros.html" import photo %}
{% block content %}
  {{ page.content }}
  <div class="people-list">
    {% for p in data.staff %}
    <article class="person">
      {{ photo(p) }}
      <div class="person-body">
        <h2>{{ p.name }}</h2>
        <p class="person-title">{{ p.title }}</p>
        <div class="bio">{{ p.bio|markdown }}</div>
        {% if p.email %}<p><a href="mailto:{{ p.email }}">{{ p.email }}</a></p>{% endif %}
      </div>
    </article>
    {% endfor %}
  </div>
{% endblock %}
